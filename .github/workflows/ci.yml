name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (the acceptance tests, the examples, the tutorial)
        run: cargo test --release

      - name: Verify the examples
        run: cargo run --release -- verify

      - name: The playground's WebAssembly build agrees with the native one
        run: node web/build.mjs && node web/test.mjs

      - name: The editor extension
        working-directory: editors/vscode
        run: npm ci && node build.mjs && npm test

  prolog:
    # ABSYS-E07: the experiments on SWI-Prolog, pinned to the version they
    # were recorded on, compared with the recorded output.
    runs-on: ubuntu-latest
    container: swipl:11.0.1
    steps:
      - uses: actions/checkout@v4

      - name: E07, the experiments
        run: swipl -q research/e07/e07.pl | diff -u research/e07/e07.out -

      - name: E07, the incremental session on an engine
        run: swipl -q research/e07/e07-session.pl | diff -u research/e07/e07-session.out -
